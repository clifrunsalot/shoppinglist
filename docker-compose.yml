services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      FLASK_APP: app.main
      # Single worker keeps the in-memory rate-limit counter shared across all
      # requests.  If you scale to multiple workers later, switch
      # RATELIMIT_STORAGE_URI to a Redis URL instead.
      GUNICORN_WORKERS: 1
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
